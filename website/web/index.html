<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A separate responsive Flutter Web project for Posture Fix Pro.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="posture_fix_pro_web">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Posture Fix Pro | Premium Web Dashboard</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      background-color: #0b2917;
      color: #ffffff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .spinner {
      width: 50px;
      height: 50px;
      border: 3px solid rgba(255,255,255,0.1);
      border-radius: 50%;
      border-top-color: #10b981;
      animation: spin 1s ease-in-out infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .title {
      font-size: 24px;
      font-weight: bold;
      margin-top: 20px;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <div class="title">Posture Fix Pro</div>
  
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
