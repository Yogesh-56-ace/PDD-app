name: posture_fix_pro
description: Posture Fix Pro - AI-Powered Posture Monitoring & Correction Native Flutter App.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  lucide_icons: ^0.257.0
  fl_chart: ^0.66.2

  # State Management & Networking
  provider: ^6.1.1
  http: ^1.2.0
  shared_preferences: ^2.2.2
  intl: ^0.19.0

  # Camera & AI Pose Detection
  camera: ^0.10.5+9
  google_mlkit_pose_detection: ^0.10.0
  image_picker: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
